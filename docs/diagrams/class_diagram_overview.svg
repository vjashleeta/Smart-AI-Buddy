<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1370" viewBox="0 0 1900 1370" role="img" aria-labelledby="title desc">
  <title id="title">Smart AI Buddy UML Class Diagram - High-Level View</title>
  <desc id="desc">High-level UML package view of actual backend controller, service, repository, entity, DTO, and configuration classes. Module-level Mermaid class diagrams contain the detailed relationships and entity multiplicities.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#526b80"/></marker>
    <style>
      text{font-family:Arial,sans-serif;fill:#17324d}.title{font-size:34px;font-weight:700}.subtitle{font-size:18px;fill:#526b80}.package{fill:#f8fbfd;stroke:#6f8ba2;stroke-width:2}.package-title{font-size:23px;font-weight:700}.package-path{font-size:15px;fill:#526b80}.item{font-size:16px}.item-small{font-size:14px}.line{fill:none;stroke:#526b80;stroke-width:3;marker-end:url(#arrow)}.layer{font-size:14px;fill:#526b80;font-weight:700}.footer{font-size:15px;fill:#526b80}
    </style>
  </defs>
  <rect width="1900" height="1370" fill="#fff"/>
  <text class="title" x="60" y="62">Smart AI Buddy - UML Class Diagram</text>
  <text class="subtitle" x="60" y="96">High-level backend package view; detailed module diagrams are supplied as editable Mermaid sources.</text>

