  <rect class="package" x="55" y="995" width="1790" height="290" rx="12"/>
  <text class="package-title" x="78" y="1037">Supporting project types</text>
  <text class="package-path" x="78" y="1064">Configuration classes and representative request / response DTOs</text>
  <text class="item" x="78" y="1106">config: SecurityConfiguration, PasswordEncoderConfiguration, ChatConfiguration, TimeConfiguration</text>
  <text class="item" x="78" y="1140">Auth DTOs: RegistrationRequest, RegistrationResponse, LoginRequest, EmailVerificationRequest, ResetPasswordRequest</text>
  <text class="item" x="78" y="1174">Chat DTOs: ChatMessageRequest, ChatMessageResponse, ChatConversationResponse, ChatTurn, SocraticRequest</text>
  <text class="item" x="78" y="1208">Study DTOs: AddQuizMaterialRequest, QuizAnswerRequest, CreateStudySessionRequest, PlannerResponse, DashboardResponse</text>
