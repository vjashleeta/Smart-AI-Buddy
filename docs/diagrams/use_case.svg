<svg xmlns="http://www.w3.org/2000/svg" width="1750" height="1320" viewBox="0 0 1750 1320" role="img" aria-labelledby="title desc">
  <title id="title">Figure 4.3 - Smart AI Buddy Student Use Cases</title>
  <desc id="desc">Student actor connected to twelve implemented account, learning, resource and profile use cases.</desc>
  <defs>
    <style>
      text{font-family:Arial,sans-serif;fill:#17324d}.title{font-size:34px;font-weight:700}.subtitle{font-size:18px;fill:#526b80}.boundary{fill:#fbfdfe;stroke:#7d95a8;stroke-width:2}.ellipse{fill:#edf4f8;stroke:#6f8ba2;stroke-width:2}.ell-label{font-size:17px;font-weight:600;text-anchor:middle}.boundary-title{font-size:20px;font-weight:700;fill:#536c80}.association{fill:none;stroke:#647d91;stroke-width:2}.actor{stroke:#17324d;stroke-width:4;fill:none;stroke-linecap:round}.caption{font-size:15px;fill:#526b80}
