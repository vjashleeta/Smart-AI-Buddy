<text class="section" x="80" y="1500">Mapped relationships and cardinalities</text>
<text class="rel" x="80" y="1540">users  1 : many  email_verification_codes</text>
<text class="rel" x="80" y="1573">users  1 : 0..1  password_reset_tokens</text>
<text class="rel" x="80" y="1606">users  1 : many  chat_conversations</text>
<text class="rel" x="80" y="1639">chat_conversations  1 : many  chat_messages</text>
<text class="rel" x="80" y="1672">users  1 : many  learning_activities</text>
<text class="rel" x="80" y="1705">users  1 : 0..1  study_plans</text>
<text class="rel" x="80" y="1738">study_plans  1 : many  study_sessions</text>
<text class="rel" x="1120" y="1540">users  1 : many  quiz_study_materials</text>
<text class="rel" x="1120" y="1573">quiz_study_materials  1 : many  quiz_concepts</text>
<text class="rel" x="1120" y="1606">users  1 : many  quiz_attempts</text>
<text class="rel" x="1120" y="1639">quiz_attempts  1 : many  quiz_attempt_questions</text>
<text class="rel" x="1120" y="1672">quiz_concepts  1 : many  quiz_attempt_questions</text>
<text class="rel" x="1120" y="1705">quiz_attempt_questions  1 : 0..1  quiz_answers</text>
<text class="note" x="80" y="1782">Composite unique keys: email_verification_codes(user_id, purpose); chat_messages(conversation_id, request_id); quiz_concepts(material_id, sequence_number); quiz_attempt_questions(attempt_id, question_position) and (attempt_id, concept_id).</text>
<text class="note" x="80" y="1805">Column names use Hibernate snake-case conventions where no explicit @Column name is given. See README for the live-schema limitation.</text>
</svg>