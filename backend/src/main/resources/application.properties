spring.application.name=Smart AI Buddy
spring.datasource.url=jdbc:mysql://localhost:3306/smart_ai_buddy
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
smart-ai-buddy.quiz.mastery-consecutive-correct=${QUIZ_MASTERY_CONSECUTIVE_CORRECT:2}
smart-ai-buddy.quiz.questions-per-attempt=${QUIZ_QUESTIONS_PER_ATTEMPT:5}
smart-ai-buddy.quiz.topic.max-characters=${QUIZ_TOPIC_MAX_CHARACTERS:200}
smart-ai-buddy.quiz.pdf.max-file-bytes=${QUIZ_PDF_MAX_FILE_BYTES:20971520}
smart-ai-buddy.quiz.pdf.max-pages=${QUIZ_PDF_MAX_PAGES:300}
smart-ai-buddy.quiz.pdf.max-extracted-characters=${QUIZ_PDF_MAX_EXTRACTED_CHARACTERS:12000}
smart-ai-buddy.time-zone=${APP_TIME_ZONE:Asia/Kolkata}
smart-ai-buddy.ai.api-key=${GEMINI_API_KEY:}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
smart-ai-buddy.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
smart-ai-buddy.public-base-url=${PUBLIC_APP_BASE_URL:http://localhost:8080}
